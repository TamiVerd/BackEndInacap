<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title text-center">Iniciar Sesión</h2>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        {{ form.as_p }}

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary mt-3">Ingresar</button>
                        </div>
                    </form>
                    <hr>
                    <p class="text-center">¿No tienes una cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
